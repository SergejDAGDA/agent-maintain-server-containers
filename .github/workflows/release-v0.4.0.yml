name: Publish v0.4.0 (manually approved SHA)

# No publication on merge. Require explicit approved SHA and two main CI gates.
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact full 40-character merged main commit SHA"
        required: true
        type: string
      confirmation:
        description: "Type PUBLISH-v0.4.0 to authorize publication"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: msc-publish-v0.4.0
  cancel-in-progress: false

jobs:
  release-v040:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH-v0.4.0' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout exact human-approved SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - name: Validate both CI gates and publish once
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B .github/scripts/publish_v040.py
