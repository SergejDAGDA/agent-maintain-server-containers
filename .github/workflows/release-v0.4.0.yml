name: Publish v0.4.0 after both release CI gates

# Publication occurs ONLY after the disposable integration workflow finishes
# on a push to this repository's main branch. The job independently checks
# that the matching Tests workflow succeeded at exactly that main commit.
on:
  workflow_run:
    workflows: ["Disposable Compose recovery fixture"]
    types: [completed]

permissions:
  contents: read

# Serialize this version's runs; unrelated main pushes can still occur.
concurrency:
  group: msc-publish-v0.4.0
  cancel-in-progress: false

jobs:
  release-v040:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: v0.4.0
    steps:
      - name: Checkout exact tested main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify unchanged main, manifest identity and Tests success
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [[ "$current" != "$RELEASE_SHA" ]]; then
            echo "Refuse release: tested commit is no longer current main"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          for path in ("plugin.json", ".claude-plugin/plugin.json"):
              assert json.loads(Path(path).read_text())["version"] == "0.4.0", path
          assert Path("skills/maintain-server-containers/VERSION").read_text().strip() == "0.4.0"
          assert Path("skills/maintain-server-containers/SKILL.md").is_file()
          assert "## 0.4.0 - 2026-10-14" in Path("CHANGELOG.md").read_text()
          assert Path("docs/releases/v0.4.0.md").is_file()
          assert "v0.4.0" in Path("README.md").read_text()
          assert "v0.4.0" in Path("README.ru.md").read_text()
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?head_sha=$RELEASE_SHA&branch=main&per_page=20" \
            | jq -e --arg sha "$RELEASE_SHA" '
              [.workflow_runs[] |
                select(.head_sha == $sha and
                       .head_branch == "main" and
                       .event == "push" and
                       .status == "completed" and
                       .conclusion == "success")] | length > 0'
          echo "Both independent CI gates succeeded on current main"

      - name: Publish or verify immutable v0.4.0 Release
        shell: bash
        run: |
          set -euo pipefail
          check_current_main() {
            current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
            if [[ "$current" != "$RELEASE_SHA" ]]; then
              echo "Refuse release: main moved since the tested commit"
              exit 1
            fi
          }
          exact_tag="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" \
            | jq -c --arg full "refs/tags/$RELEASE_TAG" \
              '[.[] | select(.ref == $full)]')"
          tag_count="$(jq 'length' <<< "$exact_tag")"
          if [[ "$tag_count" -gt 1 ]]; then
            echo "Refuse release: ambiguous exact tag"
            exit 1
          fi
          existing=""
          if [[ "$tag_count" -eq 1 ]]; then
            object_type="$(jq -r '.[0].object.type' <<< "$exact_tag")"
            if [[ "$object_type" != "commit" ]]; then
              echo "Refuse release: exact tag must reference a commit"
              exit 1
            fi
            existing="$(jq -r '.[0].object.sha' <<< "$exact_tag")"
          fi
          # Authenticated listing includes draft releases. Fetch every page,
          # and refuse draft/prerelease/partial states, never report success.
          releases="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -sc --arg tag "$RELEASE_TAG" \
              '[.[][] | select(.tag_name == $tag)]')"
          release_count="$(jq 'length' <<< "$releases")"
          if [[ "$release_count" -gt 1 ]]; then
            echo "Refuse release: duplicate records for exact tag"
            exit 1
          fi
          if [[ "$release_count" -eq 1 ]]; then
            if [[ -z "$existing" ]]; then
              echo "Refuse release: Release exists without its tag"
              exit 1
            fi
            release_state="$(jq -r '.[0] |
              if .draft == true then "draft"
              elif .prerelease == true then "prerelease"
              elif .published_at == null then "unpublished"
              else "published" end' <<< "$releases")"
            if [[ "$release_state" != "published" ]]; then
              echo "Refuse release: existing Release is not published ($release_state)"
              exit 1
            fi
            echo "Published v0.4.0 is frozen; new main commits do not republish it"
            exit 0
          fi
          # Recover a tag-only partial run only if tag = exact tested main.
          # Never force-move or delete an existing tag.
          if [[ -n "$existing" && "$existing" != "$RELEASE_SHA" ]]; then
            echo "Refuse release: existing tag points to a different commit"
            exit 1
          fi
          check_current_main
          if [[ -z "$existing" ]]; then
            check_current_main
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" \
              -f "sha=$RELEASE_SHA" >/dev/null
            echo "Tag created at verified main SHA"
          fi
          confirmed="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$confirmed" != "$RELEASE_SHA" ]]; then
            echo "Refuse release: tag does not match tested commit"
            exit 1
          fi
          # No API here atomically locks main against unrelated writers.
          # Check immediately before publishing and fail on detected drift.
          check_current_main
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --target "$RELEASE_SHA" \
            --title "Maintain Server Containers v0.4.0" \
            --notes-file docs/releases/v0.4.0.md

          published="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          jq -e --arg tag "$RELEASE_TAG" '
            .tag_name == $tag and .draft == false and
            .prerelease == false and .published_at != null' <<< "$published" >/dev/null
          pinned="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$pinned" != "$RELEASE_SHA" ]]; then
            echo "Refuse release: published tag identity changed"
            exit 1
          fi
          echo "Published $RELEASE_TAG from tested SHA $RELEASE_SHA"
