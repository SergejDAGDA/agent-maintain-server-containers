name: Publish v0.4.0 after both release CI gates

# Publication occurs ONLY after the disposable integration workflow finishes
# on a push to this repository's main branch. The job independently checks
# that the matching Tests workflow succeeded at exactly that main commit.
on:
  workflow_run:
    workflows: ["Disposable Compose recovery fixture"]
    types: [completed]

permissions:
  contents: read

jobs:
  release-v040:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: v0.4.0
    steps:
      - name: Checkout exact tested main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify unchanged main, manifest identity and Tests success
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [[ "$current" != "$RELEASE_SHA" ]]; then
            echo "Refuse release: tested commit is no longer current main"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          for path in ("plugin.json", ".claude-plugin/plugin.json"):
              assert json.loads(Path(path).read_text())["version"] == "0.4.0", path
          assert Path("skills/maintain-server-containers/VERSION").read_text().strip() == "0.4.0"
          assert Path("skills/maintain-server-containers/SKILL.md").is_file()
          assert "## 0.4.0 - 2026-10-13" in Path("CHANGELOG.md").read_text()
          assert Path("docs/releases/v0.4.0.md").is_file()
          assert "v0.4.0" in Path("README.md").read_text()
          assert "v0.4.0" in Path("README.ru.md").read_text()
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?head_sha=$RELEASE_SHA&branch=main&per_page=20" \
            | jq -e --arg sha "$RELEASE_SHA" '
              [.workflow_runs[] |
                select(.head_sha == $sha and
                       .head_branch == "main" and
                       .event == "push" and
                       .status == "completed" and
                       .conclusion == "success")] | length > 0'
          echo "Both independent CI gates succeeded on current main"

      - name: Create immutable-version tag and GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          # An absent exact tag is represented as an empty list. A direct
          # lookup with --jq can print the literal "null" on a 404 payload,
          # which must never be mistaken for the SHA of a real tag.
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" \
            | jq -r --arg full "refs/tags/$RELEASE_TAG" \
              '[.[] | select(.ref == $full)][0].object.sha // empty')"
          if [[ "$existing" == "null" ]]; then
            echo "Refuse ambiguous tag lookup result"
            exit 1
          fi
          # Immutable release: do not move existing tags or overwrite releases.
          # Compare the existing tag with its published release target.
          if [[ -n "$existing" ]]; then
            published_target="$(gh release view "$RELEASE_TAG" --json targetCommitish --jq '.targetCommitish' 2>/dev/null || true)"
            if [[ -n "$published_target" ]]; then
              if [[ "$published_target" != "$existing" ]]; then
                echo "Refuse release: published target and tag differ"
                exit 1
              fi
              echo "Published v0.4.0 is frozen; new main commits do not republish it"
              exit 0
            fi
            if [[ "$existing" != "$RELEASE_SHA" ]]; then
              echo "Refuse release: existing tag points to a different commit"
              exit 1
            fi
          else
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Refuse release: publication exists without expected tag"
              exit 1
            fi
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" \
              -f "sha=$RELEASE_SHA" >/dev/null
            echo "Release tag created at verified main SHA"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite its contents"
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --target "$RELEASE_SHA" \
            --title "Maintain Server Containers v0.4.0" \
            --notes-file docs/releases/v0.4.0.md
          echo "Published $RELEASE_TAG from tested SHA $RELEASE_SHA"
