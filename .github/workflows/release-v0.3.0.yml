name: Publish v0.3.0 after both release CI gates

# Publication occurs ONLY after the disposable integration workflow finishes
# on a push to this repository's main branch. The job independently checks
# that the matching Tests workflow succeeded at exactly that main commit.
on:
  workflow_run:
    workflows: ["Disposable Compose recovery fixture"]
    types: [completed]

permissions:
  contents: read

jobs:
  release-v030:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: v0.3.0
    steps:
      - name: Checkout exact tested main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify unchanged main, manifest identity and Tests success
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [[ "$current" != "$RELEASE_SHA" ]]; then
            echo "Refuse release: tested commit is no longer current main"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          for path in ("plugin.json", ".claude-plugin/plugin.json"):
              assert json.loads(Path(path).read_text())["version"] == "0.3.0", path
          assert Path("skills/maintain-server-containers/VERSION").read_text().strip() == "0.3.0"
          assert Path("skills/maintain-server-containers/SKILL.md").is_file()
          assert "## 0.3.0 - 2026-10-13" in Path("CHANGELOG.md").read_text()
          assert Path("docs/releases/v0.3.0.md").is_file()
          assert "v0.3.0" in Path("README.md").read_text()
          assert "v0.3.0" in Path("README.ru.md").read_text()
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?head_sha=$RELEASE_SHA&branch=main&per_page=20" \
            | jq -e --arg sha "$RELEASE_SHA" '
              [.workflow_runs[] |
                select(.head_sha == $sha and
                       .head_branch == "main" and
                       .event == "push" and
                       .status == "completed" and
                       .conclusion == "success")] | length > 0'
          echo "Both independent CI gates succeeded on current main"

      - name: Create immutable-version tag and GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null || true)"
          if [[ -n "$existing" && "$existing" != "$RELEASE_SHA" ]]; then
            echo "Refuse release: existing tag points to a different commit"
            exit 1
          fi
          if [[ -z "$existing" ]]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" \
              -f "sha=$RELEASE_SHA" >/dev/null
            echo "Release tag created at verified main SHA"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite its contents"
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --target "$RELEASE_SHA" \
            --title "Maintain Server Containers v0.3.0" \
            --notes-file docs/releases/v0.3.0.md
          echo "Published $RELEASE_TAG from tested SHA $RELEASE_SHA"
