name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r skills/maintain-server-containers/scripts/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python skills/maintain-server-containers/scripts/maintenance.py --policy examples/services.yaml validate
      - run: python skills/maintain-server-containers/scripts/maintenance.py --policy examples/services.yaml plan
