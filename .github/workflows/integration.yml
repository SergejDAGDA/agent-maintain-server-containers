name: Disposable Compose recovery fixture

on:
  pull_request:
    paths:
      - ".github/workflows/integration.yml"
      - "tests/integration/**"
      - "tests/test_integration_*.py"
      - "tests/test_restic_fixture_contract.py"
      - "tests/test_recovery_contract.py"
      - "skills/maintain-server-containers/scripts/recovery_contract.py"
      - "skills/maintain-server-containers/scripts/maintenance.py"
      - "skills/maintain-server-containers/scripts/native_policy.py"
      - "skills/maintain-server-containers/scripts/native_runtime.py"
      - "tests/test_audit22_hardening.py"
      - "skills/maintain-server-containers/scripts/migration_contract.py"
      - "skills/maintain-server-containers/scripts/failure_domain_contract.py"
      - "skills/maintain-server-containers/scripts/storage_provider_contract.py"
      - "skills/maintain-server-containers/scripts/trusted_inspector_registry.py"
      - "skills/maintain-server-containers/scripts/witness_attestation_contract.py"
      - "skills/maintain-server-containers/scripts/ledger_continuity_contract.py"
      - "skills/maintain-server-containers/scripts/current_anchor_source_contract.py"
      - "skills/maintain-server-containers/scripts/monotonic_head_contract.py"
      - "tests/test_e2e_fault_chain.py"
      - "tests/test_monotonic_head_contract.py"
      - "tests/test_current_anchor_source_contract.py"
      - "tests/test_ledger_continuity_contract.py"
      - "tests/test_witness_attestation_contract.py"
      - "skills/maintain-server-containers/scripts/requirements.txt"
      - "tests/test_trusted_inspector_registry.py"
      - "tests/test_storage_provider_contract.py"
      - "tests/test_failure_domain_contract.py"
      - "tests/test_migration_contract.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/integration.yml"
      - "tests/integration/**"
      - "tests/test_integration_*.py"
      - "tests/test_restic_fixture_contract.py"
      - "tests/test_recovery_contract.py"
      - "skills/maintain-server-containers/scripts/recovery_contract.py"
      - "skills/maintain-server-containers/scripts/maintenance.py"
      - "skills/maintain-server-containers/scripts/native_policy.py"
      - "skills/maintain-server-containers/scripts/native_runtime.py"
      - "tests/test_audit22_hardening.py"
      - "skills/maintain-server-containers/scripts/migration_contract.py"
      - "skills/maintain-server-containers/scripts/failure_domain_contract.py"
      - "skills/maintain-server-containers/scripts/storage_provider_contract.py"
      - "skills/maintain-server-containers/scripts/trusted_inspector_registry.py"
      - "skills/maintain-server-containers/scripts/witness_attestation_contract.py"
      - "skills/maintain-server-containers/scripts/ledger_continuity_contract.py"
      - "skills/maintain-server-containers/scripts/current_anchor_source_contract.py"
      - "skills/maintain-server-containers/scripts/monotonic_head_contract.py"
      - "tests/test_e2e_fault_chain.py"
      - "tests/test_monotonic_head_contract.py"
      - "tests/test_current_anchor_source_contract.py"
      - "tests/test_ledger_continuity_contract.py"
      - "tests/test_witness_attestation_contract.py"
      - "skills/maintain-server-containers/scripts/requirements.txt"
      - "tests/test_trusted_inspector_registry.py"
      - "tests/test_storage_provider_contract.py"
      - "tests/test_failure_domain_contract.py"
      - "tests/test_migration_contract.py"

permissions:
  contents: read

jobs:
  synthetic-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      MSC_DISPOSABLE_TEST_RUNNER: isolated-ci-fixture-v1
    steps:
      - name: Checkout public synthetic fixtures
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install reviewed OSS backup tool for synthetic-only integration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq restic
          restic version
      - name: Install maintained witness signature verification dependency
        run: python -m pip install -r skills/maintain-server-containers/scripts/requirements.txt
      - name: Run offline recovery and authorization guard regressions
        run: python -B -m unittest discover -s tests -p "test_integration_*.py" -v
      - name: Run Restic scope and refusal regression tests
        run: python -B -m unittest discover -s tests -p "test_restic_fixture_contract.py" -v
      - name: Test disposable Compose startup, restore, corruption refusal and cleanup
        run: python -B tests/integration/harness.py --run
      - name: Test synthetic PostgreSQL multi-service recovery and bounded cleanup
        run: python -B tests/integration/pg_group_harness.py --run
