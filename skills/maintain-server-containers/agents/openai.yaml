interface:
  display_name: "Maintain Server Containers"
  short_description: "Audit, plan and deploy approved Docker Compose project releases"
  default_prompt: "Use $maintain-server-containers to audit the current Docker Compose deployment and project policy. Start read-only unless I explicitly request an update. For project-owned release deployments, follow the deploy-project workflow and synchronize verified records through the responsible project-memory and documentation protocols. Preserve persistent state and enforce ownership, backup, migration and rollback gates."
